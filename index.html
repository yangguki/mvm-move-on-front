<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVN 스킨 샘플 · 네온 아케이드</title>
<style>
  :root{--neon:#00f0ff;--pink:#ff2bd6;--lime:#b6ff3b;--bg:#07051a;--dur:.7s;--ease:cubic-bezier(.65,0,.35,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
  /* TV 1920x1080 기준 스테이지, 다른 해상도에선 비율 유지하며 축소 */
  .stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;
    background:radial-gradient(ellipse at 50% -10%,#2a0d5c 0%,var(--bg) 60%);
    display:flex;flex-direction:column;align-items:center;padding:36px 60px 48px;gap:28px;color:#fff}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:linear-gradient(transparent 0 50%,rgba(255,255,255,.03) 50% 100%);background-size:100% 4px}
  /* 상단 스킨 영역 */
  .hud{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px}
  .fade{transition:opacity .3s ease}
  .fade.out{opacity:0}
  .step{font-size:34px;font-weight:800;letter-spacing:4px;color:var(--lime);text-shadow:0 0 12px var(--lime)}
  .step small{display:block;font-size:22px;letter-spacing:2px;color:#cfc8ff;text-shadow:none;margin-top:6px}
  .name{font-size:72px;font-weight:900;text-align:center;color:#fff;
    text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 48px var(--pink)}
  .timer{justify-self:end;font-family:"Courier New",monospace;font-size:96px;font-weight:700;color:var(--pink);
    text-shadow:0 0 10px var(--pink),0 0 30px var(--pink);line-height:1}
  .timer span{font-size:24px;display:block;text-align:right;color:#cfc8ff;text-shadow:none;letter-spacing:3px}
  .bar{width:100%;height:18px;border-radius:9px;background:#1b1440;border:2px solid #3a2a7a;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--pink));
    box-shadow:0 0 16px var(--neon)}
  /* 하단 레이아웃: 메인 자리(16:9, 폭 1228) + NEXT 패널(폭 540). 자리 표시용이며 실제 영상은 아래 .frame */
  .videoWrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;gap:32px}
  .slotMain{width:1228px;max-height:100%;aspect-ratio:16/9;flex:0 0 auto}
  .next{flex:0 0 540px;display:flex;flex-direction:column;gap:20px;align-self:flex-end;
    opacity:0;transform:translateX(40px);transition:opacity .5s,transform .5s}
  .next.show{opacity:1;transform:none}
  .next .tag{align-self:flex-start;font-size:50px;font-weight:900;letter-spacing:8px;color:var(--bg);background:var(--lime);
    padding:8px 26px;border-radius:14px;box-shadow:0 0 18px var(--lime);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .next .slotPv{width:100%;aspect-ratio:16/9}
  .next .nname{font-size:50px;font-weight:800;line-height:1.25;text-shadow:0 0 10px var(--pink)}
  .next .nmeta{font-size:32px;color:#cfc8ff;letter-spacing:2px}
  /* 영상 프레임 2개(A/B): 역할(main/pv)에 따라 자리·테두리가 바뀌고, 전환 시 미리보기가 메인 자리로 커지며 이동 */
  .frame{position:absolute;overflow:hidden;background:#000;z-index:2}
  .frame video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .frame.main{border-radius:32px;border:4px solid var(--neon);
    box-shadow:0 0 24px var(--neon),0 0 60px rgba(255,43,214,.45),inset 0 0 20px rgba(0,240,255,.3)}
  .frame.pv{border-radius:24px;border:4px solid var(--pink);box-shadow:0 0 18px var(--pink);opacity:0;transition:opacity .5s}
  .frame.pv.show{opacity:1}
  .frame.anim{transition:left var(--dur) var(--ease),top var(--dur) var(--ease),width var(--dur) var(--ease),height var(--dur) var(--ease),
    border-radius var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),opacity var(--dur) var(--ease)}
  .frame.leaving{opacity:0;z-index:1}
  .frame.grow{z-index:3}
  .noanim,.noanim *{transition:none!important}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud">
    <div class="step fade" id="stepBox"><span id="stepNo">STEP 1 / 2</span><small id="meta"></small></div>
    <div class="name fade" id="name"></div>
    <div class="timer"><span>REMAINING</span><b id="t">00:40</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="videoWrap">
    <div class="slotMain" id="slotMain"></div>
    <div class="next" id="next">
      <div class="tag">NEXT</div>
      <div class="slotPv" id="slotPv"></div>
      <div class="nname" id="nname"></div>
      <div class="nmeta" id="nmeta"></div>
    </div>
  </div>
  <div class="frame main" id="fA"><video muted loop playsinline autoplay preload="auto"></video></div>
  <div class="frame pv" id="fB"><video muted loop playsinline preload="auto"></video></div>
</div>
<script>
  // 샘플 운동 목록 (운동명·세트는 샘플용 값). 실제 서비스는 운동 사이에 휴식 화면이 있지만 샘플은 바로 전환
  var EX=[
    {name:'덤벨 숄더 프레스',meta:'SET 1 / 3 · 12회',src:'mvn_dumbbell.mp4'},
    {name:'얼터네이트 숄더 프레스',meta:'SET 1 / 3 · 좌우 10회',src:'mvn_shoulder_press.mp4'}
  ];
  var NEXT_LEAD=10000, MOVE_MS=700;
  var q=new URLSearchParams(location.search);
  var total=(+q.get('sec')||40)*1000, forceNext=q.get('next')==='1';
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),nextEl=$('next'),scale=1;

  function fit(){scale=Math.min(innerWidth/1920,innerHeight/1080);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';}
  addEventListener('resize',function(){fit();place(main,R('slotMain'));place(pv,R('slotPv'));});
  fit();

  // 자리 표시 요소의 위치를 스테이지(1920x1080) 좌표로 계산. NEXT 패널의 슬라이드 이동은 제외
  function R(id){var s=stage.getBoundingClientRect(),r=$(id).getBoundingClientRect();
    var dx=(id==='slotPv'&&!nextEl.classList.contains('show'))?40*scale:0;
    return {l:(r.left-s.left-dx)/scale,t:(r.top-s.top)/scale,w:r.width/scale,h:r.height/scale};}
  function place(f,r){f.style.left=r.l+'px';f.style.top=r.t+'px';f.style.width=r.w+'px';f.style.height=r.h+'px';}
  function vid(f){return f.querySelector('video')}
  // play() 거부(로딩 중·전환 race)는 잠시 뒤 재시도
  function safePlay(v,tries){tries=tries||0;var p=v.play();
    if(p&&p.catch)p.catch(function(){if(tries<5)setTimeout(function(){safePlay(v,tries+1)},300);});}

  var main=$('fA'),pv=$('fB'),idx=0,start=0,nextShown=false,moving=false;

  function setHud(i){var c=EX[i];
    $('stepNo').textContent='STEP '+(i+1)+' / '+EX.length;$('meta').textContent=c.meta;$('name').textContent=c.name;}
  function setNextInfo(i){var n=EX[(i+1)%EX.length];
    $('nname').textContent=n.name;$('nmeta').textContent=n.meta;var v=vid(pv);v.src=n.src;v.load();}
  function setNext(on){
    if(on===nextShown)return;nextShown=on;
    nextEl.classList.toggle('show',on);pv.classList.toggle('show',on);
    if(on)safePlay(vid(pv));
  }

  // 전환: 이미 재생 중인 미리보기 플레이어가 메인 자리로 커지며 이동, 기존 메인은 페이드아웃
  function advance(now){
    moving=true;var ni=(idx+1)%EX.length;
    safePlay(vid(pv));
    pv.classList.add('show','anim','grow');main.classList.add('anim','leaving');
    pv.classList.remove('pv');pv.classList.add('main');
    place(pv,R('slotMain'));
    nextShown=false;nextEl.classList.remove('show');            // NEXT 글자·배지 페이드아웃
    $('stepBox').classList.add('out');$('name').classList.add('out'); // 상단 크로스페이드
    setTimeout(function(){setHud(ni);$('stepBox').classList.remove('out');$('name').classList.remove('out');},300);
    idx=ni;start=now;                                            // 타이머는 새 운동 시간으로 리셋
    setTimeout(function(){
      var old=main;main=pv;pv=old;
      main.classList.remove('anim','grow');
      pv.classList.add('noanim');pv.classList.remove('anim','leaving','main','show');pv.classList.add('pv');
      vid(pv).pause();place(pv,R('slotPv'));setNextInfo(idx);
      pv.offsetWidth;pv.classList.remove('noanim');
      moving=false;
    },MOVE_MS+50);
  }

  function tick(now){
    var el=now-start;
    if(el>=total&&!moving){advance(now);el=0;}
    var left=Math.max(0,Math.ceil((total-el)/1000));
    $('t').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    $('bar').style.width=Math.min(100,el/total*100)+'%';
    if(!moving)setNext(forceNext||total-el<=NEXT_LEAD);
    requestAnimationFrame(tick);
  }


  // ?debug=1: 영상 상태를 콘솔에 기록(재현·점검용)
  if(q.get('debug')==='1'){
    ['fA','fB'].forEach(function(id){var v=vid($(id));
      ['pause','play','playing','waiting','stalled','ended','error','emptied','suspend'].forEach(function(e){
        v.addEventListener(e,function(){console.log('EV',Math.round(performance.now()),id,e,(v.currentTime||0).toFixed(2),v.src.split('/').pop(),'role='+($(id)===main?'main':'pv'));});});});
    setInterval(function(){[main,pv].forEach(function(f,i){var v=vid(f);
      console.log('ST',i?'pv':'main',f.id,v.src.split('/').pop(),'t='+v.currentTime.toFixed(2),'paused='+v.paused,'rs='+v.readyState);});},1000);
  }
  // 워치독: 재생해야 할 영상(메인 + 보이는 미리보기)이 멈췄거나 시간이 1.5초 넘게 안 흐르면 자동 재개
  var wd={};
  function watch(f,label){var v=vid(f),w=wd[label]||(wd[label]={t:-1,since:performance.now(),hits:0});
    var now=performance.now();
    if(v.currentTime!==w.t){w.t=v.currentTime;w.since=now;return;}
    if(v.paused||now-w.since>1500){
      w.hits++;
      if(w.hits%3===0){var ct=v.currentTime;v.load();v.currentTime=ct;} // 반복되면 다시 로드
      safePlay(v);w.since=now;
      if(q.get('debug')==='1')console.log('WD resume',label,f.id,v.src.split('/').pop(),'t='+v.currentTime.toFixed(2),'paused='+v.paused);
    }}
  setInterval(function(){if(moving)return;watch(main,'main');if(nextShown)watch(pv,'pv');else wd.pv=null;},500);
  ['fA','fB'].forEach(function(id){var v=vid($(id));
    ['pause','stalled'].forEach(function(e){v.addEventListener(e,function(){
      var f=$(id);if(!moving&&(f===main||(f===pv&&nextShown)))setTimeout(function(){if(vid(f).paused)safePlay(vid(f));},200);});});});

  if(forceNext){nextEl.classList.add('noanim');pv.classList.add('noanim');}
  setHud(0);vid(main).src=EX[0].src;safePlay(vid(main));
  place(main,R('slotMain'));place(pv,R('slotPv'));setNextInfo(0);
  start=performance.now();requestAnimationFrame(tick);
</script>
</body>
</html>
