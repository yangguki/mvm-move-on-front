<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVN 스킨 샘플 · 네온 아케이드</title>
<style>
  :root{--neon:#00f0ff;--pink:#ff2bd6;--lime:#b6ff3b;--bg:#07051a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
  /* TV 1920x1080 기준 스테이지, 다른 해상도에선 비율 유지하며 축소 */
  .stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;
    background:radial-gradient(ellipse at 50% -10%,#2a0d5c 0%,var(--bg) 60%);
    display:flex;flex-direction:column;align-items:center;padding:36px 60px 48px;gap:28px;color:#fff}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(transparent 0 50%,rgba(255,255,255,.03) 50% 100%);background-size:100% 4px}
  /* 상단 스킨 영역 */
  .hud{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px}
  .step{font-size:34px;font-weight:800;letter-spacing:4px;color:var(--lime);text-shadow:0 0 12px var(--lime)}
  .step small{display:block;font-size:22px;letter-spacing:2px;color:#cfc8ff;text-shadow:none;margin-top:6px}
  .name{font-size:72px;font-weight:900;text-align:center;color:#fff;
    text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 48px var(--pink)}
  .timer{justify-self:end;font-family:"Courier New",monospace;font-size:96px;font-weight:700;color:var(--pink);
    text-shadow:0 0 10px var(--pink),0 0 30px var(--pink);line-height:1}
  .timer span{font-size:24px;display:block;text-align:right;color:#cfc8ff;text-shadow:none;letter-spacing:3px}
  .bar{width:100%;height:18px;border-radius:9px;background:#1b1440;border:2px solid #3a2a7a;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--pink));
    box-shadow:0 0 16px var(--neon)}
  /* 하단 영상 박스: 16:9 고정, 남은 높이에 맞춰 축소 */
  .videoWrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
  .videoBox{height:100%;max-width:100%;aspect-ratio:16/9;border-radius:32px;overflow:hidden;background:#000;
    border:4px solid var(--neon);box-shadow:0 0 24px var(--neon),0 0 60px rgba(255,43,214,.45),inset 0 0 20px rgba(0,240,255,.3)}
  .videoBox video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud">
    <div class="step">STEP 2 / 5<small>SET 1 / 3 · 12회</small></div>
    <div class="name">덤벨 숄더 프레스</div>
    <div class="timer"><span>REMAINING</span><b id="t">00:40</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="videoWrap">
    <div class="videoBox">
      <video src="mvn_dumbbell.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>
  </div>
</div>
<script>
  // 화면 크기에 맞춰 1920x1080 스테이지 비율 유지 축소
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);
    document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
  addEventListener('resize',fit);fit();
  // 운동 시간 카운트다운 (?sec=40), 끝나면 다시 시작
  var total=(+new URLSearchParams(location.search).get('sec')||40)*1000,start=performance.now();
  var tEl=document.getElementById('t'),bar=document.getElementById('bar');
  function tick(now){var el=now-start;if(el>=total){start=now;el=0;}
    var left=Math.ceil((total-el)/1000);
    tEl.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    bar.style.width=(el/total*100)+'%';requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
</script>
</body>
</html>
