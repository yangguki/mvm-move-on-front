<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVN 스킨 샘플 · 네온 아케이드</title>
<style>
  :root{--neon:#00f0ff;--pink:#ff2bd6;--lime:#b6ff3b;--bg:#07051a;--dur:.7s;--ease:cubic-bezier(.65,0,.35,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
  /* TV 1920x1080 기준 스테이지, 다른 해상도에선 비율 유지하며 축소 */
  .stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;
    background:radial-gradient(ellipse at 50% -10%,#2a0d5c 0%,var(--bg) 60%);
    display:flex;flex-direction:column;align-items:center;padding:12px 60px 6px;gap:8px;color:#fff}
  /* 스캔라인은 영상 프레임(z2) 아래에 둠: 영상 위 전면 반투명 레이어가 매 영상 프레임마다 합성되던 비용 제거(흰 영상 위에선 원래 안 보임) */
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(transparent 0 50%,rgba(255,255,255,.03) 50% 100%);background-size:100% 4px}
  /* 상단 스킨 영역 */
  /* 상단 HUD는 영상 자리를 최대로 쓰도록 68px 한 줄로 압축 */
  .hud{width:100%;height:68px;flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px}
  .fade{transition:opacity .3s ease}
  .fade.out{opacity:0}
  .step{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--lime);text-shadow:0 0 12px var(--lime)}
  .step small{display:block;font-size:18px;letter-spacing:2px;color:#cfc8ff;text-shadow:none;margin-top:4px}
  .name{font-size:52px;line-height:1.1;font-weight:900;text-align:center;color:#fff;
    text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 48px var(--pink)}
  .timer{justify-self:end;display:flex;align-items:center;gap:16px;font-family:"Courier New",monospace;font-size:64px;font-weight:700;color:var(--pink);
    text-shadow:0 0 10px var(--pink),0 0 30px var(--pink);line-height:1}
  .timer span{font-size:20px;color:#cfc8ff;text-shadow:none;letter-spacing:3px}
  .bar{width:100%;height:8px;flex:0 0 auto;border-radius:4px;background:#1b1440;border:1px solid #3a2a7a;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--neon),var(--pink));
    box-shadow:0 0 16px var(--neon)}
  /* 하단 영역 1800x970. 메인 자리는 가운데 1776x970(영상은 cover로 위아래 흰 여백만 약간 잘림).
     NEXT 표시 중엔 메인을 transform(translate+scale)으로 왼쪽 1228폭까지 줄이고, 오른쪽 540px에 NEXT 패널 */
  .videoWrap{flex:1;min-height:0;width:100%;position:relative}
  .slotMain{position:absolute;left:12px;top:0;width:1776px;height:970px}
  .next{position:absolute;z-index:3;right:0;top:0;bottom:0;width:540px;display:flex;flex-direction:column;justify-content:center;gap:20px;
    opacity:0;transform:translateX(40px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .next.show{opacity:1;transform:none}
  .next .tag{align-self:flex-start;font-size:50px;font-weight:900;letter-spacing:8px;color:var(--bg);background:var(--lime);
    padding:8px 26px;border-radius:14px;box-shadow:0 0 18px var(--lime);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .next .slotPv{width:100%;aspect-ratio:16/9}
  .next .nname{font-size:50px;font-weight:800;line-height:1.25;text-shadow:0 0 10px var(--pink)}
  .next .nmeta{font-size:32px;color:#cfc8ff;letter-spacing:2px}
  /* 영상 프레임 2개(A/B): 역할(main/pv)에 따라 자리·테두리가 바뀌고, 전환 시 미리보기가 메인 자리로 커지며 이동 */
  /* 영상 프레임은 스케일된 스테이지 밖(body)에 실제 px로 배치 → 영상 요소에 상위 transform·둥근 클리핑·위 겹침 없음(파일 단독 재생과 같은 빠른 합성 경로).
     테두리·글로우는 프레임(영상 뒤)에만, 영상은 테두리 안쪽 10px에 네모로(클리핑 없음) */
  .frame{position:absolute;background:#000;z-index:2;transform-origin:0 0}
  /* cover + 46%: 메인(1776x970) 기준 원본 위 16px·아래 19px만 잘림(인물·덤벨·발 바깥 흰 여백). 16:9 미리보기는 잘림 없음 */
  .frame video{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:cover;object-position:50% 46%;display:block;background:#000}
  .frame.main{border-radius:32px;border:4px solid var(--neon);
    box-shadow:0 0 24px var(--neon),0 0 60px rgba(255,43,214,.45),inset 0 0 20px rgba(0,240,255,.3);
    transition:transform var(--dur) var(--ease)}
  .frame.pv{border-radius:24px;border:4px solid var(--pink);box-shadow:0 0 18px var(--pink);opacity:0;transform:translateX(40px);visibility:hidden;
    transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),visibility 0s linear var(--dur)}
  .frame.pv.show{opacity:1;transform:none;visibility:visible;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .frame.anim{transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .frame.leaving{opacity:0;z-index:1;visibility:visible}
  .frame.grow{z-index:3}
  .noanim,.noanim *{transition:none!important}
  /* 휴식(REST): 메인 자리엔 휴식 이미지(영상 위 크로스페이드), 오른쪽 위 REST + 남은 초, 그 아래 NEXT 패널(다음 운동 미리보기) 유지 */
  .frame .still{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:cover;display:block;opacity:0;visibility:hidden;
    transition:opacity .6s ease,visibility 0s linear .6s;pointer-events:none}
  .frame.stillOn .still{opacity:1;visibility:visible;transition:opacity .6s ease}  /* 안 보일 땐 visibility:hidden → 영상 위 투명 레이어 없음 */
  .stage.resting .timer b{color:var(--lime);text-shadow:0 0 10px var(--lime),0 0 30px var(--lime)}
  .stage.resting .bar i{background:linear-gradient(90deg,var(--lime),var(--neon));box-shadow:0 0 16px var(--lime)}
  .rest{position:absolute;z-index:4;display:flex;flex-direction:row;align-items:center;gap:24px;
    opacity:0;transform:translateX(40px);transition:opacity .5s,transform .5s;pointer-events:none}
  .rest.show{opacity:1;transform:none}
  .rest .big{font-size:96px;font-weight:900;letter-spacing:10px;line-height:1;color:var(--lime);
    text-shadow:0 0 16px var(--lime),0 0 48px var(--lime);animation:blink 1.2s steps(2) infinite}
  .rest .cnt{font-family:"Courier New",monospace;font-size:150px;font-weight:700;line-height:1;color:var(--pink);
    text-shadow:0 0 14px var(--pink),0 0 40px var(--pink)}
  /* 소리 켜기(자동재생 정책): 클릭/리모컨 OK 시 오디오 시작 후 숨김 */
  .sndBtn{position:absolute;z-index:8;left:50%;bottom:80px;transform-origin:50% 100%;transform:translateX(-50%) scale(var(--s,1));font:inherit;font-size:44px;font-weight:900;
    letter-spacing:3px;color:var(--bg);background:var(--neon);border:4px solid #fff;border-radius:999px;padding:18px 56px;
    box-shadow:0 0 24px var(--neon),0 0 60px var(--pink);cursor:pointer;animation:blink 1.2s steps(2) infinite}
  .sndBtn:focus{outline:none;box-shadow:0 0 0 8px var(--pink),0 0 40px var(--neon)}
  .sndBtn.hide{display:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud">
    <div class="step fade" id="stepBox"><span id="stepNo">STEP 1 / 2</span><small id="meta"></small></div>
    <div class="name fade" id="name"></div>
    <div class="timer"><span id="tl">REMAINING</span><b id="t">00:20</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="videoWrap" id="vw">
    <div class="slotMain" id="slotMain"></div>
    <div class="next" id="next">
      <div class="tag" id="ntag">NEXT</div>
      <div class="slotPv" id="slotPv"></div>
      <div class="nname" id="nname"></div>
      <div class="nmeta" id="nmeta"></div>
    </div>
  </div>
  <div class="rest" id="rest">
    <div class="big">REST</div>
    <div class="cnt" id="rcnt"></div>
  </div>
</div>
  <div class="frame main" id="fA"><video muted loop playsinline preload="auto"></video><img class="still" src="rest_image.jpg" alt=""></div>
  <div class="frame pv" id="fB"><video muted loop playsinline preload="auto"></video><img class="still" src="rest_image.jpg" alt=""></div>
  <button type="button" class="sndBtn" id="snd" tabindex="0">🔊 소리 켜기</button>
<script>
  // 샘플 운동 목록 (운동명·세트는 샘플용 값). 흐름: 운동1 20초 → 운동2 20초(바로 전환) → 휴식 10초 → 운동1 ... 무한 반복
  var EX=[
    // 반복은 영상 파일 안에서 해결: 짧은 클립을 10번 이어 붙인 파일(무손실)을 운동마다 영상 1개로 끝까지 재생, 시간은 타이머(endsAt)가 기준.
    // clip=원본 클립 길이(초). 미리보기가 길게 재생돼(NEXT 10초+휴식+운동) 파일이 모자라면, 커지기 약 1초 전(아직 작은 미리보기일 때) clip의 배수만큼 되감음(같은 장면이라 티 안 남)
    // video의 loop 속성은 그래도 파일 길이를 넘을 때만 쓰이는 안전장치(넘는 지점에서 1회 기본 반복)
    {name:'덤벨 숄더 프레스',meta:'SET 1 / 3 · 12회',src:'mvn_shoulder_press.mp4',clip:2.6},          // 2.6s x10 = 26.0s
    {name:'얼터네이트 숄더 프레스',meta:'SET 1 / 3 · 좌우 10회',src:'mvn_shoulder_press.mp4',clip:3.6333} // 3.63s x10 = 36.3s
  ];
  var NEXT_LEAD=10000, MOVE_MS=700;
  var q=new URLSearchParams(location.search);
  // ?sec=운동 초(기본 20, 두 운동 공통), ?rest=휴식 초(기본 10, 0이면 휴식 없음). 휴식은 마지막 운동 뒤에만
  var EX_MS=(+q.get('sec')||20)*1000, REST_MS=q.has('rest')?Math.max(0,+q.get('rest')||0)*1000:10000;
  var total=EX_MS, phase='ex', segId=0, forceNext=q.get('next')==='1', DBG=q.get('debug')==='1';
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),nextEl=$('next'),scale=1;

  // 스테이지(HUD·텍스트)만 transform으로 맞춤. 영상 프레임은 스테이지 밖에서 실제 px로 배치(place)
  var OX=0,OY=0;
  function fit(){scale=Math.min(innerWidth/1920,innerHeight/1080);OX=(innerWidth-1920*scale)/2;OY=(innerHeight-1080*scale)/2;
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';document.documentElement.style.setProperty('--s',scale);}
  addEventListener('resize',function(){fit();if(!moving){main.style.transform='';place(main,mainSide?sideGeo():R('slotMain'));}
    place(pv,R('slotPv'));placeRest();});
  fit();

  // 자리 표시 요소의 위치를 스테이지(1920x1080) 좌표로 계산. NEXT 패널의 슬라이드 이동은 제외
  function R(id){var s=stage.getBoundingClientRect(),r=$(id).getBoundingClientRect();
    var dx=(id==='slotPv'&&!nextEl.classList.contains('show'))?40*scale:0;
    return {l:(r.left-s.left-dx)/scale,t:(r.top-s.top)/scale,w:r.width/scale,h:r.height/scale};}
  function placeS(f,r){f.style.left=r.l+'px';f.style.top=r.t+'px';f.style.width=r.w+'px';f.style.height=r.h+'px';}   // 스테이지 안 요소
  function place(f,r){f.style.left=(OX+r.l*scale)+'px';f.style.top=(OY+r.t*scale)+'px';f.style.width=(r.w*scale)+'px';f.style.height=(r.h*scale)+'px';} // 영상 프레임(실제 px)
  // FLIP용: 실제 자리 to에 둔 프레임을 from 자리처럼 보이게 하는 transform(끝나면 none → 정상 상태엔 transform 없음)
  function inv(from,to){var k=from.w/to.w;return 'translate('+((from.l-to.l)*scale)+'px,'+((from.t-to.t+(from.h-to.h*k)/2)*scale)+'px) scale('+k+')';}
  function vid(f){return f.querySelector('video')}
  // 메인 축소 배치(NEXT·휴식 중): 왼쪽 정렬, 폭 = 1800-540-32, 세로 가운데. 같은 비율로 축소라 늘어남 없음
  function sideGeo(){var F=R('slotMain'),W=R('vw'),k=(W.w-540-32)/F.w;
    return {l:W.l,t:F.t+(F.h-F.h*k)/2,w:F.w*k,h:F.h*k,k:k,dx:W.l-F.l,dy:(F.h-F.h*k)/2};}
  var mainSide=false;
  // 메인 축소/복귀: 최종 자리에 실제 크기로 먼저 배치하고, 이전 자리처럼 보이는 transform에서 none으로 애니메이션(FLIP).
  // 끝나면 transform 없음 → NEXT·휴식 중에도 영상은 변형 없는 상태로 재생
  function mainLayout(side,anim){if(side===mainSide)return;mainSide=side;
    var F=R('slotMain'),G=sideGeo(),from=side?F:G,to=side?G:F;
    main.classList.add('noanim');place(main,to);
    if(anim){main.style.transform=inv(from,to);main.offsetWidth;main.classList.remove('noanim');main.style.transform='';}
    else{main.style.transform='';main.offsetWidth;main.classList.remove('noanim');}}
  function nextAtStart(){return forceNext||EX_MS<=NEXT_LEAD;}
  // REST + 남은 초: 오른쪽 열, NEXT 태그 위 빈 공간
  function placeRest(){var W=R('vw'),tg=R('ntag');placeS($('rest'),{l:W.l+W.w-540,t:W.t+8,w:540,h:Math.max(120,tg.t-W.t-24)});}
  function restsAfter(i){return i===EX.length-1&&REST_MS>0;}
  // play() 거부(로딩 중·전환 race)는 잠시 뒤 재시도
  function safePlay(v,tries){tries=tries||0;var p=v.play();
    if(p&&p.catch)p.catch(function(){if(tries<5)setTimeout(function(){safePlay(v,tries+1)},300);});}

  var main=$('fA'),pv=$('fB'),idx=0,start=0,nextShown=false,moving=false;

  function setHud(i){var c=EX[i];
    $('stepNo').textContent='STEP '+(i+1)+' / '+EX.length;$('meta').textContent=c.meta;$('name').textContent=c.name;
    $('tl').textContent='REMAINING';}
  function setHudRest(i){var c=EX[i];
    $('stepNo').textContent='REST';$('meta').textContent='NEXT · STEP '+(i+1)+' / '+EX.length;$('name').textContent='휴식';
    $('tl').textContent='REST';$('nmeta').textContent=c.meta;}
  // NEXT는 항상 다음 '운동'(운동2 뒤엔 휴식 후 운동1, 표시에 '휴식 후' 명시)
  function setNextInfo(i){var n=EX[(i+1)%EX.length];
    $('nname').textContent=n.name;$('nmeta').textContent=(restsAfter(i)?'휴식 후 · ':'')+n.meta;var v=vid(pv);v.src=n.src;v.load();}
  function decodeStill(){[].forEach.call(document.querySelectorAll('.still'),function(im){if(im.decode)im.decode().catch(function(){});});}
  function setNext(on){
    if(on===nextShown)return;nextShown=on;lastChange=performance.now();
    if(on&&restsAfter(idx))decodeStill();                         // 휴식 10초 전에 휴식 이미지 미리 디코딩
    nextEl.classList.toggle('show',on);pv.classList.toggle('show',on);
    mainLayout(on,true);                                         // 메인은 transform으로 줄며 왼쪽으로(또는 원래 크기로)
    if(on)safePlay(vid(pv));
  }

  // 전환: 이미 재생 중인 미리보기 플레이어가 메인 자리로 커지며 이동, 기존 메인은 페이드아웃
  function advance(now){
    moving=true;lastChange=performance.now();var ni=(idx+1)%EX.length;
    safePlay(vid(pv));
    // FLIP: 프레임을 최종 자리(메인 크기)에 두고 미리보기 위치·크기에 해당하는 transform에서 시작 → transform만 애니메이션(레이아웃·재래스터 없음)
    var side=nextAtStart(),F=side?sideGeo():R('slotMain'),f0=R('slotPv');
    pv.classList.add('noanim');place(pv,F);
    pv.style.transform=inv(f0,F);
    pv.classList.remove('pv');pv.classList.add('main','show','anim','grow');
    pv.offsetWidth;pv.classList.remove('noanim');                 // 전환당 1회만 강제 스타일 계산
    pv.style.transform='';
    main.classList.add('anim','leaving');
    nextShown=false;nextEl.classList.remove('show');            // NEXT 글자·배지 페이드아웃
    $('stepBox').classList.add('out');$('name').classList.add('out'); // 상단 크로스페이드
    $('rest').classList.remove('show');                          // 휴식에서 오는 경우 REST 표시 페이드아웃
    setTimeout(function(){setHud(ni);stage.classList.remove('resting');$('stepBox').classList.remove('out');$('name').classList.remove('out');},300);
    idx=ni;start=now;                                            // 타이머는 새 운동 시간으로 리셋
    setTimeout(function(){
      var old=main;main=pv;pv=old;
      main.classList.remove('anim','grow');main.style.transform='';mainSide=side;   // 이미 최종 자리(실제 px), transform 없음
      pv.classList.add('noanim');pv.style.transform='';pv.classList.remove('anim','leaving','main','show','stillOn');pv.classList.add('pv');
      vid(pv).pause();place(pv,R('slotPv'));setNextInfo(idx);
      pv.offsetWidth;pv.classList.remove('noanim');
      moving=false;
    },MOVE_MS+50);
  }

  // 운동2 → 휴식: 메인(축소 상태 유지) 위로 휴식 이미지 크로스페이드, NEXT 패널(운동1 미리보기)은 그대로, 위에 REST+초.
  // 휴식 끝엔 advance()로 이미 재생 중인 미리보기가 메인 자리로 커짐(검은 화면 없음)
  function toRest(t){
    lastChange=performance.now();setNext(true);mainLayout(true,true);main.classList.add('stillOn');
    var covered=main;setTimeout(function(){if(phase==='rest'&&covered===main)vid(covered).pause();},700);  // 이미지에 가려진 운동2 영상은 디코딩 중지(동시 디코딩 최대 2개)
    $('stepBox').classList.add('out');$('name').classList.add('out');
    setTimeout(function(){setHudRest((idx+1)%EX.length);stage.classList.add('resting');
      $('stepBox').classList.remove('out');$('name').classList.remove('out');$('rest').classList.add('show');},300);
    start=t;
  }
  // 구간 종료. 다음 구간 시작은 이론상 종료 시각(start+total)으로 잡아 타이머·음성 드리프트 방지
  function endSegment(now){
    var t=start+total;if(now-t>1000)t=now;
    if(phase==='ex'&&restsAfter(idx)){phase='rest';total=REST_MS;toRest(t);}
    else if(phase==='ex'){advance(t);}
    else{phase='ex';total=EX_MS;advance(t);}
    pvFit=false;segId++;mark('seg'+segId+':start',now);startBar();
    if(DBG)console.log('SEG',segId,phase,'at',Math.round(now),'late='+Math.round(now-t)+'ms');
  }
  var dispMark={},lastLeft=-1,pvFit=false;
  function fitPv(remSec){var v=vid(pv),c=EX[(idx+1)%EX.length].clip,D=v.duration,t=v.currentTime,need=remSec+EX_MS/1000+.3;
    if(!c||!D||t+need<=D)return;var k=Math.ceil((t+need-D)/c);if(t-k*c<0)return;
    v.currentTime=t-k*c;if(DBG)console.log('PVFIT',t.toFixed(2),'->',(t-k*c).toFixed(2));}
  function mark(k,t){if(!(k in dispMark))dispMark[k]=t;}

  // 진행바: 구간마다 한 번 compositor 애니메이션(transform scaleX)으로 시작 → 매 프레임 JS·레이아웃 없음
  var barAnim=null;
  function startBar(){var b=$('bar'),el=performance.now()-start,p=Math.max(0,Math.min(1,el/total)),d=Math.max(0,total-el);
    if(barAnim){barAnim.cancel();barAnim=null;}
    if(b.animate)barAnim=b.animate([{transform:'scaleX('+p+')'},{transform:'scaleX(1)'}],{duration:d,easing:'linear',fill:'forwards'});
    else{b.style.transition='none';b.style.transform='scaleX('+p+')';b.offsetWidth;b.style.transition='transform '+d+'ms linear';b.style.transform='scaleX(1)';}}

  // 화면 숫자가 바뀌는 순간(초 경계)과 그 250ms 전(음성 예약)에만 깨어남. 바뀐 값만 DOM에 씀
  function tick(now){
    audioTick(now);                       // 구간 끝 음성이 먼저 처리되도록 전환 전에 호출
    if(now-start>=total&&!moving)endSegment(now);
    var el=now-start;
    var left=Math.max(0,Math.ceil((total-el)/1000));
    if(left!==lastLeft){lastLeft=left;
      $('t').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
      if(phase==='rest')$('rcnt').textContent=left;
      mark('seg'+segId+':'+left,now);}
    if(!moving&&phase==='ex')setNext(forceNext||total-el<=NEXT_LEAD);
    if(!moving&&nextShown&&!pvFit&&total-el<=1500&&!(phase==='ex'&&restsAfter(idx))){pvFit=true;fitPv((total-el)/1000);}
  }
  function loop(){var now=performance.now();tick(now);
    var rem=total-(performance.now()-start),toChange=rem>0?rem-(Math.ceil(rem/1000)-1)*1000:0,w=toChange;
    if(toChange>LOOKAHEAD-40)w=toChange-250;                      // 오디오 큐 예약 시점
    if(moving)w=Math.min(w,50);                                    // 전환 중 구간 종료 재확인
    setTimeout(loop,Math.max(4,Math.min(1000,w+2)));}

  // ===== 오디오: 영상은 muted, 소리는 별도 재생 =====
  // http(s): Web Audio(fetch+decodeAudioData, BGM은 ogg AudioBufferSourceNode loop, GainNode 덕킹, 큐는 AudioContext 시각에 예약)
  // file://: Chrome이 fetch/XHR와 MediaElementSource(무음 출력)를 막으므로 <audio> 재생 + volume 덕킹으로 대체
  var AUD='audio/',FILES={bgm:'bgm_gym_loop.ogg',count_1:'count_1.mp3',count_2:'count_2.mp3',count_3:'count_3.mp3',
    count_4:'count_4.mp3',count_5:'count_5.mp3',rest_60:'rest_60.mp3',rest_30:'rest_30.mp3',rest_10:'rest_10.mp3',start:'start.mp3'};
  var BGM_VOL=0.6, DUCK=Math.pow(10,-9/20), LOOKAHEAD=300;   // 음성 중 BGM -9 dB
  var A={on:false,mode:'off',seg:-1,cues:[],buf:{},el:{}};
  var raw={},preload;
  if(location.protocol==='file:'||!window.fetch)preload=Promise.reject(new Error('no fetch on '+location.protocol));
  else preload=Promise.all(Object.keys(FILES).map(function(k){return fetch(AUD+FILES[k]).then(function(r){
    if(!r.ok)throw new Error(r.status+' '+FILES[k]);return r.arrayBuffer();}).then(function(b){raw[k]=b;});}));
  preload.catch(function(){});
  function alog(){if(DBG)console.log.apply(console,['AUDIO'].concat([].slice.call(arguments)));}

  function enableAudio(){
    if(A.on)return;A.on=true;$('snd').classList.add('hide');
    var AC=window.AudioContext||window.webkitAudioContext,ac=null;
    if(AC&&location.protocol!=='file:'){try{ac=new AC();if(ac.resume)ac.resume();}catch(e){ac=null;}}  // 제스처 안에서 생성
    preload.then(function(){if(!ac)throw new Error('no AudioContext');
      return Promise.all(Object.keys(raw).map(function(k){return new Promise(function(res,rej){
        ac.decodeAudioData(raw[k].slice(0),function(b){A.buf[k]=b;res();},rej);});}));})
    .then(function(){startWebAudio(ac);},function(e){alog('webaudio unavailable:',e&&e.message);if(ac&&ac.close)ac.close();startElementAudio();});
  }
  function startWebAudio(ac){
    A.ac=ac;A.mode='webaudio';
    A.bgmGain=ac.createGain();A.bgmGain.gain.value=BGM_VOL;A.bgmGain.connect(ac.destination);
    A.voice=ac.createGain();A.voice.connect(ac.destination);
    var s=ac.createBufferSource();s.buffer=A.buf.bgm;s.loop=true;s.connect(A.bgmGain);s.start();
    alog('mode=webaudio','bgm='+A.buf.bgm.duration.toFixed(3)+'s','sr='+ac.sampleRate,'state='+ac.state);
    cueNow('start');
  }
  function startElementAudio(){
    A.mode='element';
    Object.keys(FILES).forEach(function(k){var e=new Audio(AUD+FILES[k]);e.preload='auto';A.el[k]=e;});
    var b=A.el.bgm;b.loop=true;b.volume=BGM_VOL;b.play().catch(function(e){alog('bgm play fail',e&&e.message);});
    // 덕킹: 음성 재생 중이면 -9 dB (attack ~50ms, release ~300ms)
    setInterval(function(){var on=false;
      for(var k in A.el)if(k!=='bgm'&&!A.el[k].paused&&!A.el[k].ended)on=true;
      var tg=on?BGM_VOL*DUCK:BGM_VOL,tau=on?.017:.1;b.volume=tg+(b.volume-tg)*Math.exp(-.02/tau);},20);
    alog('mode=element');
    cueNow('start');
  }
  // 성능시각(performance.now) ↔ AudioContext 시각 (실제 출력 시점 기준)
  // 출력 시점 기준 시각 대응. 오디오 장치가 막 켜져 클럭이 아직 안 흐르면(시작 직후 ~1초) null → 예약 보류
  function outTs(){var ac=A.ac,now=performance.now();if(ac.currentTime<.05)return null;
    if(ac.getOutputTimestamp){var ts=ac.getOutputTimestamp();
      return (ts.performanceTime>0&&Math.abs(ts.performanceTime-now)<250&&Math.abs(ts.contextTime-ac.currentTime)<.25)?ts:null;}
    return {contextTime:ac.currentTime-(ac.baseLatency||0)-(ac.outputLatency||0),performanceTime:now};}
  function ctxAt(p){var ts=outTs();return ts.contextTime+(p-ts.performanceTime)/1000;}
  function perfOf(ct){var ts=outTs();return ts.performanceTime+(ct-ts.contextTime)*1000;}
  function playBuf(k,when){var ac=A.ac,b=A.buf[k];if(!b)return when;
    var T=Math.max(when,ac.currentTime),s=ac.createBufferSource();s.buffer=b;s.connect(A.voice);s.start(T);
    var g=A.bgmGain.gain;g.setTargetAtTime(BGM_VOL*DUCK,Math.max(T-.05,ac.currentTime),.017);g.setTargetAtTime(BGM_VOL,T+b.duration,.1);
    return T;}
  function playEl(k,cue){var e=A.el[k];if(!e)return;try{e.currentTime=0;}catch(x){}
    if(DBG&&cue)e.onplaying=function(){e.onplaying=null;alog('playing',k,'elemDelay='+Math.round(performance.now()-cue.fired)+'ms');};
    var p=e.play();if(p&&p.catch)p.catch(function(x){alog('play fail',k,x&&x.message);});}
  function cueNow(k){if(A.mode==='webaudio')playBuf(k,A.ac.currentTime);else playEl(k);alog('CUE',k,'(sound on)','disp='+$('t').textContent);}
  // 현재 구간의 음성 큐: 끝나기 5..1초 전 숫자(화면 숫자가 N으로 바뀌는 순간), 구간 끝에 휴식 안내/시작
  function cuesFor(){var L=[],end=start+total,s=segId;
    for(var n=5;n>=1;n--)if(n*1000<=total)L.push({k:'count_'+n,at:end-n*1000,ref:'seg'+s+':'+n});
    if(phase==='ex'&&restsAfter(idx)){var rk={60000:'rest_60',30000:'rest_30',10000:'rest_10'}[REST_MS];
      if(rk)L.push({k:rk,at:end,ref:'seg'+(s+1)+':start'});else if(DBG&&!A.skipLogged){A.skipLogged=1;alog('rest voice skipped: rest='+REST_MS/1000+'s (60/30/10 only)');}}
    else L.push({k:'start',at:end,ref:'seg'+(s+1)+':start'});      // 다음 운동 시작(운동→운동, 휴식→운동)
    return L;}
  var cueStats=[];
  function audioTick(now){
    if(A.mode==='off')return;
    if(A.seg!==segId){A.seg=segId;A.cues=A.cues.filter(function(c){return c.done&&!c.checked;}).concat(cuesFor());}
    A.cues.forEach(function(c){
      if(!c.done){
        if(c.at<now-150){c.done=c.checked=true;return;}           // 소리를 늦게 켠 경우 지난 큐는 건너뜀
        if(A.mode==='webaudio'&&c.at-now<=LOOKAHEAD&&outTs()){c.ct=playBuf(c.k,ctxAt(c.at));c.done=true;}
        else if(A.mode==='element'&&now>=c.at){c.fired=now;playEl(c.k,c);c.done=true;}
        return;}
      if(c.checked||!(c.ref in dispMark))return;
      var out=A.mode==='webaudio'?(outTs()?perfOf(c.ct):0):c.fired;
      if(A.mode==='webaudio'&&(!outTs()||performance.now()<out+30))return;
      c.checked=true;var off=Math.round(out-dispMark[c.ref]);cueStats.push({k:c.k,off:off});
      alog('CUE',c.k,'mode='+A.mode,'disp='+$('t').textContent,'offset='+off+'ms (audio out - display change)');
    });
    A.cues=A.cues.filter(function(c){return !c.checked;});
  }
  $('snd').addEventListener('click',enableAudio);
  addEventListener('keydown',function(e){if(!A.on&&(e.key==='Enter'||e.keyCode===13)){e.preventDefault();enableAudio();}});
  window.mvnAudioStats=function(){return {mode:A.mode,cues:cueStats};};


  // ?debug=1: 영상 상태를 콘솔에 기록(재현·점검용)
  if(q.get('debug')==='1'){
    ['fA','fB'].forEach(function(id){var v=vid($(id));
      ['pause','play','playing','waiting','stalled','ended','error','emptied','suspend'].forEach(function(e){
        v.addEventListener(e,function(){console.log('EV',Math.round(performance.now()),id,e,(v.currentTime||0).toFixed(2),v.src.split('/').pop(),'role='+($(id)===main?'main':'pv'));});});});
    setInterval(function(){console.log('DEC',[main,pv].map(function(f){var v=vid(f);var q=v.getVideoPlaybackQuality?v.getVideoPlaybackQuality():{};return f.id+(f===main?'(main)':'(pv)')+':'+(v.paused?'paused':'PLAY')+' drop='+q.droppedVideoFrames+'/'+q.totalVideoFrames}).join(' '));},2000);
    setInterval(function(){[main,pv].forEach(function(f,i){var v=vid(f);
      console.log('ST',i?'pv':'main',f.id,v.src.split('/').pop(),'t='+v.currentTime.toFixed(2),'paused='+v.paused,'rs='+v.readyState);});},1000);
  }
  // ?debug=1: 메인 영상 프레임 통계(rVFC). 전환 직후 0.9초는 제외한 정상 상태 기준: 최대 표시 간격, 건너뛴 영상 프레임 수(mediaTime 간격>1.5프레임), 파일 끝 반복 수
  var lastChange=0;
  if(DBG&&window.HTMLVideoElement&&'requestVideoFrameCallback' in HTMLVideoElement.prototype){
    var fg={max:0,n:0,skip:0,wrap:0,seg:-1};
    ['fA','fB'].forEach(function(id){var v=vid($(id)),last=null;
      v.requestVideoFrameCallback(function cb(now,m){var f=$(id);
        if(fg.seg!==segId){if(fg.seg>=0)console.log('FRAMEGAP seg'+fg.seg,'steadyMax='+Math.round(fg.max)+'ms','frames='+fg.n,'skipped='+fg.skip,'wraps='+fg.wrap,'skipAt='+(fg.at||[]).slice(0,40).join(','));fg={max:0,n:0,skip:0,wrap:0,seg:segId};last=null;}
        if(f===main&&!moving&&!v.paused&&now-lastChange>900){
          if(last){var g=m.expectedDisplayTime-last.t,dm=m.mediaTime-last.mt;if(g>fg.max)fg.max=g;if(dm<0)fg.wrap++;else if(dm>1.5/30){fg.skip+=Math.round(dm*30)-1;(fg.at=fg.at||[]).push(((now-start)/1000).toFixed(1)+(nextShown?'N':''));}}
          fg.n++;last={t:m.expectedDisplayTime,mt:m.mediaTime};}
        else last=null;
        v.requestVideoFrameCallback(cb);});});
  }
  // 워치독: 재생해야 할 영상(메인 + 보이는 미리보기)이 멈췄거나 시간이 1.5초 넘게 안 흐르면 자동 재개
  var wd={};
  function watch(f,label){var v=vid(f),w=wd[label]||(wd[label]={t:-1,since:performance.now(),hits:0});
    var now=performance.now();
    if(v.currentTime!==w.t){w.t=v.currentTime;w.since=now;return;}
    if(v.paused||now-w.since>1500){
      w.hits++;
      if(w.hits%3===0){var ct=v.currentTime;v.load();v.currentTime=ct;} // 반복되면 다시 로드
      safePlay(v);w.since=now;
      if(q.get('debug')==='1')console.log('WD resume',label,f.id,v.src.split('/').pop(),'t='+v.currentTime.toFixed(2),'paused='+v.paused);
    }}
  setInterval(function(){if(moving)return;if(phase!=='rest')watch(main,'main');else wd.main=null;if(nextShown)watch(pv,'pv');else wd.pv=null;},500);
  ['fA','fB'].forEach(function(id){var v=vid($(id));
    ['pause','stalled'].forEach(function(e){v.addEventListener(e,function(){
      var f=$(id);if(!moving&&((f===main&&phase!=='rest')||(f===pv&&nextShown)))setTimeout(function(){if(vid(f).paused&&!(f===main&&phase==='rest'))safePlay(vid(f));},200);});});});

  if(forceNext){nextEl.classList.add('noanim');pv.classList.add('noanim');}
  setHud(0);vid(main).src=EX[0].src;safePlay(vid(main));
  place(main,R('slotMain'));place(pv,R('slotPv'));placeRest();setNextInfo(0);
  if(forceNext)mainLayout(true,false);
  $('snd').focus();if(q.get('autoaudio')==='1')enableAudio();  // autoaudio=1은 테스트 전용(자동재생 허용 플래그 필요)
  decodeStill();start=performance.now();startBar();loop();
</script>
</body>
</html>
